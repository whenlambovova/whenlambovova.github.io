name: Cap nhat gia
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lay gia
        run: |
          set -e
          curl -sf "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,solana,ripple,dogecoin,pax-gold&vs_currencies=usd&include_24hr_change=true" -o /tmp/tickers.json || echo '{}' > /tmp/tickers.json
          curl -sf "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=250&interval=daily" -o /tmp/btc.json || echo '{}' > /tmp/btc.json
          curl -sf "https://api.gold-api.com/price/XAU" -o /tmp/xau.json || echo '{}' > /tmp/xau.json
          curl -sf "https://open.er-api.com/v6/latest/USD" -o /tmp/fx.json || echo '{}' > /tmp/fx.json
          node -e "
            const fs = require('fs');
            const rd = p => { try { return JSON.parse(fs.readFileSync(p)); } catch(e) { return {}; } };
            const old = rd('data/live.json');
            const t = rd('/tmp/tickers.json');
            const b = rd('/tmp/btc.json');
            const x = rd('/tmp/xau.json');
            const f = rd('/tmp/fx.json');
            fs.mkdirSync('data', { recursive: true });
            const out = {
              at: Date.now(),
              tickers: Object.keys(t).length ? t : old.tickers,
              btcDaily: b.prices ? b.prices : old.btcDaily,
              xau: x.price ? x : (old.xau || null),
              fx: (f.rates && f.rates.VND) ? f.rates.VND : (old.fx || null)
            };
            fs.writeFileSync('data/live.json', JSON.stringify(out));
          "
      - name: Commit neu co thay doi
        run: |
          git config user.name "when-lambo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "cap nhat gia $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
