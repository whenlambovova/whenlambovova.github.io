name: Cap nhat gia
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  models: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lay gia
        run: |
          set -e
          curl -sf "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,solana,ripple,dogecoin,pax-gold,cardano,avalanche-2,chainlink,polkadot,toncoin&vs_currencies=usd&include_24hr_change=true" -o /tmp/tickers.json || echo '{}' > /tmp/tickers.json
          curl -sf "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=250&interval=daily" -o /tmp/btc.json || echo '{}' > /tmp/btc.json
          curl -sf "https://api.gold-api.com/price/XAU" -o /tmp/xau.json || echo '{}' > /tmp/xau.json
          curl -sf "https://api.gold-api.com/price/XAG" -o /tmp/xag.json || echo '{}' > /tmp/xag.json
          curl -sf "https://open.er-api.com/v6/latest/USD" -o /tmp/fx.json || echo '{}' > /tmp/fx.json
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://www.coindesk.com/arc/outboundfeeds/rss/" -o /tmp/rss_coindesk.xml || echo "" > /tmp/rss_coindesk.xml
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://cointelegraph.com/rss" -o /tmp/rss_ct.xml || echo "" > /tmp/rss_ct.xml
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://vnexpress.net/rss/kinh-doanh.rss" -o /tmp/rss_vne.xml || echo "" > /tmp/rss_vne.xml
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://cafef.vn/thi-truong-chung-khoan.rss" -o /tmp/rss_cafef.xml || echo "" > /tmp/rss_cafef.xml
          curl -sf "https://vang.today/api/prices" -o /tmp/vang.json || echo '{}' > /tmp/vang.json
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://query1.finance.yahoo.com/v8/finance/chart/DX-Y.NYB?interval=1d&range=5d" -o /tmp/dxy.json || echo '{}' > /tmp/dxy.json
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://query1.finance.yahoo.com/v8/finance/chart/%5ETNX?interval=1d&range=5d" -o /tmp/vni.json || echo '{}' > /tmp/vni.json
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://query1.finance.yahoo.com/v8/finance/chart/CL%3DF?interval=1d&range=5d" -o /tmp/wti.json || echo '{}' > /tmp/wti.json
          curl -sf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "https://query1.finance.yahoo.com/v8/finance/chart/BZ%3DF?interval=1d&range=5d" -o /tmp/brent.json || echo '{}' > /tmp/brent.json
          node -e "
            const fs = require('fs');
            const rd = p => { try { return JSON.parse(fs.readFileSync(p)); } catch(e) { return {}; } };
            const old = rd('data/live.json');
            const t = rd('/tmp/tickers.json');
            const b = rd('/tmp/btc.json');
            const x = rd('/tmp/xau.json');
            const xa = rd('/tmp/xag.json');
            const f = rd('/tmp/fx.json');
            const v = rd('/tmp/vang.json');
            const rssItems = [];
            const parseRss = (file, source) => { try { const xml = fs.readFileSync(file, 'utf8'); const items = xml.split(/<item[\s>]/).slice(1); for (const it of items.slice(0, 12)) { const t = (it.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/) || it.match(/<title>([\s\S]*?)<\/title>/) || [])[1]; const l = (it.match(/<link>([\s\S]*?)<\/link>/) || [])[1]; const d = (it.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1]; if (t && l) rssItems.push({ title: t.trim(), link: l.trim(), source, at: d ? new Date(d).getTime() : Date.now() }); } } catch (e) {} };
            parseRss('/tmp/rss_coindesk.xml', 'CoinDesk');
            parseRss('/tmp/rss_ct.xml', 'Cointelegraph');
            parseRss('/tmp/rss_vne.xml', 'VnExpress Kinh doanh');
            parseRss('/tmp/rss_cafef.xml', 'CafeF');
            rssItems.sort((a, b) => b.at - a.at);
            const yh = (p, oldv) => { try { const r = rd(p).chart.result[0]; const c = r.meta.regularMarketPrice; const pc = r.meta.chartPreviousClose; return (c && pc) ? { price: c, changePct: (c - pc) / pc * 100 } : (oldv || null); } catch(e) { return oldv || null; } };
            const vang = (v && v.prices) ? {
              at: v.timestamp * 1000,
              sjc: { buy: v.prices.BTSJC?.buy || null, sell: v.prices.BTSJC?.sell || null, change: v.prices.BTSJC?.change_buy || null },
              nhan: { buy: v.prices.BT9999NTT?.buy || null, sell: v.prices.BT9999NTT?.sell || null, change: v.prices.BT9999NTT?.change_buy || null },
              doji: { buy: v.prices.DOHCML?.buy || null, sell: v.prices.DOHCML?.sell || null, change: v.prices.DOHCML?.change_buy || null },
              phuquy: { buy: v.prices.PQHNVM?.buy || null, sell: v.prices.PQHNVM?.sell || null, change: v.prices.PQHNVM?.change_buy || null }
            } : (old.vang || null);
            fs.mkdirSync('data', { recursive: true });
            const out = {
              at: Date.now(),
              tickers: Object.keys(t).length ? t : old.tickers,
              btcDaily: b.prices ? b.prices : old.btcDaily,
              xau: x.price ? x : (old.xau || null),
              xag: xa.price ? xa : (old.xag || null),
              fx: (f.rates && f.rates.VND) ? f.rates.VND : (old.fx || null),
              vang,
              macro: {
                dxy: yh('/tmp/dxy.json', old.macro && old.macro.dxy),
                us10y: yh('/tmp/vni.json', old.macro && old.macro.us10y),
                wti: yh('/tmp/wti.json', old.macro && old.macro.wti),
                brent: yh('/tmp/brent.json', old.macro && old.macro.brent)
              }
            };
            fs.writeFileSync('data/live.json', JSON.stringify(out));
            if (rssItems.length) fs.writeFileSync('data/news.json', JSON.stringify({ at: Date.now(), items: rssItems.slice(0, 24) }));
          "
      - name: Dich tin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/news.js <<'JS'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const RAW = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch (e) { return ''; } };
          const dec = (s) => String(s || '').replace(/<!\[CDATA\[|\]\]>/g, '').replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
            .replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => String.fromCharCode(parseInt(n, 16)))
            .replace(/\s+/g, ' ').trim();
          const feeds = [
            ['/tmp/rss_coindesk.xml', 'CoinDesk', 'en', 'cd'],
            ['/tmp/rss_ct.xml', 'Cointelegraph', 'en', 'ct'],
            ['/tmp/rss_vne.xml', 'VnExpress Kinh doanh', 'vi', 'vn'],
            ['/tmp/rss_cafef.xml', 'CafeF', 'vi', 'cf'],
          ];
          const mkId = (pre, link) => pre + '-' + link.split('?')[0].replace(/\/+$/, '').split('/').pop().split('.')[0].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 70);
          const fresh = [];
          for (const [file, source, lang, pre] of feeds) {
            const items = RAW(file).split(/<item[\s>]/).slice(1, 13);
            for (const it of items) {
              const g = (tag) => (it.match(new RegExp('<' + tag + '>([\\s\\S]*?)</' + tag + '>')) || [])[1];
              const title = dec(g('title')); const link = dec(g('link')).split('?')[0]; const pd = g('pubDate');
              let at = pd ? new Date(dec(pd)).getTime() : NaN; if (!(at > 0)) at = Date.now();
              let desc = dec(g('description')); if (desc.length > 420) desc = desc.slice(0, 417).replace(/\s+\S*$/, '') + '...';
              if (title && /^https?:/.test(link)) fresh.push({ id: mkId(pre, link), title, desc, link, source, at, lang });
            }
          }
          let old = [];
          try { old = JSON.parse(execSync('git show HEAD:data/news.json', { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] })).items || []; } catch (e) {}
          const map = new Map();
          for (const o of old) if (o.id) map.set(o.id, o);
          for (const f of fresh) { const o = map.get(f.id); map.set(f.id, o ? Object.assign({}, f, { title_vi: o.title_vi, desc_vi: o.desc_vi, rw: o.rw }) : f); }
          const tr = async (text) => {
            if (!text) return '';
            try {
              const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(text), { headers: { 'User-Agent': 'Mozilla/5.0' } });
              const d = await r.json();
              return d[0].map((x) => x[0]).join('').replace(/[\u200b\u200c\ufeff]/g, '').trim();
            } catch (e) { return ''; }
          };
          const rewrite = async (x) => {
            const tok = process.env.GITHUB_TOKEN; if (!tok) return null;
            const sys = 'Bạn là biên tập viên tin thị trường tiếng Việt cho trang When Lambo Vova. Viết cho người đọc bình thường, từ ngữ đơn giản, giọng bình tĩnh, rõ ràng, nghiêm túc. Chỉ dùng thông tin có trong đầu vào, không thêm số liệu hay sự kiện mới. Không khuyên mua, bán, vào lệnh hay giữ lệnh. Không sao chép câu chữ của nguồn, luôn diễn đạt lại bằng lời của mình và ngắn hơn nguồn. Mỗi bài mở đầu một cách khác nhau. Trả về JSON với ba khóa: title (tối đa 90 ký tự), summary (tối đa 2 câu, dưới 45 từ), note (mục Nhận định, 1 đến 2 câu, nêu điều đáng chú ý hoặc điều nên theo dõi tiếp, không phải lời khuyên).';
            const user = 'Tiêu đề nguồn: ' + x.title + '\nMở đầu nguồn: ' + (x.desc || '') + '\nNguồn: ' + x.source;
            try {
              const r = await fetch('https://models.github.ai/inference/chat/completions', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'openai/gpt-4.1-mini', temperature: 0.8, response_format: { type: 'json_object' }, messages: [{ role: 'system', content: sys }, { role: 'user', content: user }] }) });
              if (!r.ok) { console.log('rewrite http', r.status); return r.status === 429 ? 'stop' : null; }
              const txt = await r.text(); let d; try { d = JSON.parse(txt); } catch (e) { console.log('rewrite body', r.status, txt.slice(0, 160).replace(/\s+/g, ' ')); return null; } const o = JSON.parse(d.choices[0].message.content);
              if (o.title && o.summary && o.note) return { title: String(o.title).slice(0, 140), summary: String(o.summary).slice(0, 400), note: String(o.note).slice(0, 400) };
            } catch (e) { console.log('rewrite err', String(e).slice(0, 80)); }
            return null;
          };
          (async () => {
            let all = [...map.values()].filter((x) => x.at > Date.now() - 7 * 86400000).sort((a, b) => b.at - a.at).slice(0, 60);
            let n = 0;
            for (const x of all) {
              if (x.lang === 'vi') { x.title_vi = x.title; x.desc_vi = x.desc; continue; }
              if (!x.title_vi && n < 30) { x.title_vi = await tr(x.title); n++; await new Promise((r) => setTimeout(r, 250)); }
              if (!x.desc_vi && x.desc && n < 40) { x.desc_vi = await tr(x.desc); n++; await new Promise((r) => setTimeout(r, 250)); }
            }
            let rn = 0, stop = false;
            for (const x of all) {
              if (stop || x.rw || rn >= 10) continue;
              const o = await rewrite(x); rn++;
              if (o === 'stop') { stop = true; continue; }
              if (o) x.rw = o;
              await new Promise((r) => setTimeout(r, 4500));
            }
            console.log('rewritten', all.filter((x) => x.rw).length);
            fs.mkdirSync('data', { recursive: true });
            if (all.length) fs.writeFileSync('data/news.json', JSON.stringify({ at: Date.now(), items: all }));
            console.log('items', all.length, 'translated now', n);
          })();
          JS
          node /tmp/news.js
      - name: Commit neu co thay doi
        run: |
          git config user.name "when-lambo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live.json; git add data/news.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "cap nhat gia $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
