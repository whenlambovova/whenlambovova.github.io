name: Refresh indicative market candles
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-candles
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch permitted Biquote OHLC cache
        run: python3 4-8-refresh-market-cache.py
      - name: Commit only website candle cache
        run: |
          git config user.name 'When Lambo Data'
          git config user.email 'actions@users.noreply.github.com'
          git add 2-9-market-candles.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh attributed indicative OHLC cache'
            git pull --rebase
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage site without repository internals
        run: |
          mkdir -p /tmp/pages-site
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/pages-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site
      - name: Deploy refreshed cache to Pages
        id: deployment
        uses: actions/deploy-pages@v4
